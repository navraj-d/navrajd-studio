<script>
/* =========================================
   CR7 SECRET GAME TABS
   Type CR7 anywhere to show/hide Chess.
   ========================================= */
(() => {
  const tabId = "cr7-chess-tab";
  const target = "chess.html";
  let typed = "";

  function ensureChessTab() {
    let tab = document.getElementById(tabId);
    if (tab) return tab;

    const nav = document.querySelector("header nav");
    if (!nav) return null;

    tab = document.createElement("a");
    tab.id = tabId;
    tab.href = target;
    tab.textContent = "♟ Chess";
    tab.style.display = "none";
    tab.dataset.cr7SecretTab = "true";
    nav.appendChild(tab);
    return tab;
  }

  function toggleChessTab() {
    const tab = ensureChessTab();
    if (!tab) return;
    tab.style.display = tab.style.display === "none" ? "" : "none";
  }

  document.addEventListener("keydown", (event) => {
    if (event.key.length !== 1) return;
    typed = (typed + event.key).slice(-3).toUpperCase();
    if (typed === "CR7") {
      toggleChessTab();
      typed = "";
    }
  });

  // Keep the tab visible while on the Chess page.
  if (location.pathname.toLowerCase().endsWith("/chess.html") ||
      location.pathname.toLowerCase().endsWith("chess.html")) {
    const tab = ensureChessTab();
    if (tab) tab.style.display = "";
  }
})();
</script>
